name: Godot Android Build V3

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'Project zip to build'
        required: false
        default: 'ArtaqiAlya_Godot_V1_Fixed_v4.zip'
  push:
    paths:
      - 'ArtaqiAlya_Godot_V1_Fixed_v4.zip'
      - '.github/workflows/godot-build-v3.yml'

env:
  PROJECT_ZIP: ${{ github.event.inputs.project_zip || 'ArtaqiAlya_Godot_V1_Fixed_v4.zip' }}
  PROJECT_DIR: ${{ github.workspace }}/project/artaqi_godot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Godot editor settings
        run: |
          : "${JAVA_HOME:?JAVA_HOME is not set - is actions/setup-java configured?}"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"

          # Debug keystore (required by Godot).
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # FIX 1: Godot 4.6 reads editor_settings-<major>.<minor>.tres
          #        (the old "editor_settings-4.tres" is ignored).
          # FIX 2: export/android/java_sdk_path MUST be set, otherwise the
          #        Android export fails with:
          #        "A valid Java SDK path is required in Editor Settings."
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "--- editor_settings-4.6.tres ---"
          cat "$HOME/.config/godot/editor_settings-4.6.tres"

      - name: Download Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q -o Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          ./Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          unzip -q -o Godot_v4.6.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/4.6.3.stable/"

      - name: Extract project
        run: |
          unzip -q -o "$PROJECT_ZIP" -d project
          grep -E 'config/features|renderer/rendering_method' "$PROJECT_DIR/project.godot"

      - name: Prepare Android export configuration
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text(encoding="utf-8")
          # Mobile GPU texture compression.
          if "textures/vram_compression/import_etc2_astc=true" not in s:
              s = s.replace("[rendering]\n", "[rendering]\ntextures/vram_compression/import_etc2_astc=true\n", 1)
          # FIX 3: In Godot 4.6 the screen orientation is read from the project
          #        setting "display/window/handheld/orientation" (0 = landscape),
          #        NOT from the export preset. The game viewport is 1280x720.
          if "window/handheld/orientation=" not in s:
              s = s.replace("[display]\n", "[display]\nwindow/handheld/orientation=0\n", 1)
          p.write_text(s, encoding="utf-8")
          print(s)
          PY

          # NOTE: "screen/orientation" is NOT a valid Godot 4.6 export option and
          #       is silently ignored, so it is intentionally omitted here.
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          patch_list=Array[String]([])

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          package/unique_name="com.ramses.artaqialya"
          package/name="ارتقي عاليا"
          package/signed=true
          version/code=2
          version/name="1.0.2"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          EOF

      - name: Prepare release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ARTAQI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARTAQI_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Secret ARTAQI_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Secret ARTAQI_KEY_ALIAS is missing" && exit 1)
          keytool -genkeypair -v \
            -keystore "$HOME/artaqi-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Artaqi Alya,O=Ramses,C=EG"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/artaqi-release.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          mkdir -p "$PROJECT_DIR/build/android"
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --verbose \
            --path "$PROJECT_DIR" \
            --export-release "Android" \
            "$PROJECT_DIR/build/android/ArtaqiAlya.apk"

      - name: Verify APK
        run: |
          test -s "$PROJECT_DIR/build/android/ArtaqiAlya.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$PROJECT_DIR/build/android/ArtaqiAlya.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtaqiAlya-Godot-Android-V3
          path: ${{ env.PROJECT_DIR }}/build/android/ArtaqiAlya.apk
