name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ArtaqiAlya_Godot_V1.zip'
      - '.github/workflows/godot-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Download Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Extract project
        run: |
          unzip -q ArtaqiAlya_Godot_V1.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project/artaqi_godot" >> "$GITHUB_ENV"

      - name: Create Android export preset
        run: |
          printf '%s\n' \
            '[preset.0]' \
            'name="Android"' \
            'platform="Android"' \
            'runnable=true' \
            'dedicated_server=false' \
            'custom_features=""' \
            'export_filter="all_resources"' \
            'include_filter=""' \
            'exclude_filter=""' \
            'patch_list=Array[String]([])' \
            '' \
            '[preset.0.options]' \
            'custom_template/debug=""' \
            'custom_template/release=""' \
            'gradle_build/use_gradle_build=false' \
            'gradle_build/export_format=0' \
            'package/unique_name="com.example.artaqialya"' \
            'package/name="ارتقي عالياً"' \
            'package/signed=false' \
            'version/code=1' \
            'version/name="1.0.1"' \
            'architectures/armeabi-v7a=false' \
            'architectures/arm64-v8a=true' \
            'architectures/x86=false' \
            'architectures/x86_64=false' \
            'screen/orientation=1' \
            > "$PROJECT_DIR/export_presets.cfg"

      - name: Build Android APK
        run: |
          mkdir -p "$PROJECT_DIR/build/android"
          "$GITHUB_WORKSPACE/Godot_v4.3-stable_linux.x86_64" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-release "Android" \
            "$PROJECT_DIR/build/android/ArtaqiAlya.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtaqiAlya-Godot-Android
          path: ${{ env.PROJECT_DIR }}/build/android/ArtaqiAlya.apk
