name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARTAQI_KEYSTORE_BASE64: ${{ secrets.ARTAQI_KEYSTORE_BASE64 }}
      ARTAQI_KEYSTORE_PASSWORD: ${{ secrets.ARTAQI_KEYSTORE_PASSWORD }}
      ARTAQI_KEY_ALIAS: ${{ secrets.ARTAQI_KEY_ALIAS }}
      ARTAQI_KEY_PASSWORD: ${{ secrets.ARTAQI_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q ArtaqiAlya_v12_Secure.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project/ArtaqiAlya_v8" >> $GITHUB_ENV

      - name: Fix version
        run: |
          sed -i -E "s/^([[:space:]]*)versionCode .*/\1versionCode $GITHUB_RUN_NUMBER/" "$PROJECT_DIR/app/build.gradle"
          sed -i -E "s/^([[:space:]]*)versionName .*/\1versionName \"1.0.$GITHUB_RUN_NUMBER\"/" "$PROJECT_DIR/app/build.gradle"

      - name: Setup signing
        run: |
          printf '%s' "$ARTAQI_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/app/artaqi-release.jks"
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("${projectDir}/artaqi-release.jks")
                      storePassword System.getenv("ARTAQI_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ARTAQI_KEY_ALIAS")
                      keyPassword System.getenv("ARTAQI_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtaqiAlya-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
