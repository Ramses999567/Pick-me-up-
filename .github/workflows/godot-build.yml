on:
  workflow_dispatch:
  push:
    paths:
      - 'ArtaqiAlya_Godot_V1_Fixed_v2.zip'
      - '.github/workflows/godot-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_SDK_PATH=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]
          
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2

      - name: Download Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.6.3.stable/"

      - name: Extract project
        run: |
          unzip -q ArtaqiAlya_Godot_V1_Fixed_v2.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project/artaqi_godot" >> "$GITHUB_ENV"

      - name: Prepare Android export configuration
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text(encoding="utf-8")
          if "textures/vram_compression/import_etc2_astc=true" not in s:
              s = s.replace('[rendering]\n', '[rendering]\ntextures/vram_compression/import_etc2_astc=true\n', 1)
          p.write_text(s, encoding="utf-8")
          PY
          cat > export_presets.cfg <<'EOF2'
          [preset.0]
          
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          patch_list=Array[String]([])
          
          [preset.0.options]
          
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          package/unique_name="com.example.pickmeup"
          package/name="ارتقي عالياً"
          package/signed=false
          version/code=1
          version/name="1.0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          screen/orientation=1
          EOF2

      - name: Build Android APK
        run: |
          mkdir -p "$PROJECT_DIR/build/android"
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --verbose --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/android/ArtaqiAlya.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtaqiAlya-Godot-Android
          path: ${{ env.PROJECT_DIR }}/build/android/ArtaqiAlya.apk
