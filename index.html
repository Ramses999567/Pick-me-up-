<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>برج الناجين</title><style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#f3f4f6;font-family:Arial,sans-serif}main{max-width:700px;margin:auto;padding:18px}.hero,.card{background:#1b1e25;border:1px solid #30343d;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(145deg,#222733,#17191f)}h1{margin:0 0 6px;font-size:26px}.muted{color:#9ca3af;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{min-height:48px;border-radius:12px;border:1px solid #3a404b;background:#242832;color:#fff;font-weight:700;padding:10px;touch-action:manipulation}button.primary{background:#7c3aed;border-color:#8b5cf6}button:disabled{opacity:.4}input{font-size:16px}.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #30343d}.bar{height:9px;background:#292d36;border-radius:10px;overflow:hidden}.fill{height:100%;background:#8b5cf6}.log{max-height:170px;overflow:auto;color:#cbd5e1;font-size:13px;line-height:1.7}.badge{display:inline-block;border:1px solid #3a404b;border-radius:99px;padding:4px 8px;font-size:12px;color:#c4b5fd}@media(max-width:420px){.grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr 1fr}}
</style></head><body><main><div class="hero"><div class="muted">FLOOR 01 • SURVIVAL TRIAL</div><h1>برج الناجين</h1><div class="muted">نسخة Android تجريبية — موارد متوسطة وسلسة</div></div><div id="app"></div>
<div id="admin" style="display:none" class="card">
<h3>🛠️ تحكم المطوّر</h3>
<div class="muted" style="margin-bottom:10px">تحكم مباشر في موارد وإحصائيات اللعبة.</div>
<div class="grid2">
<label>🪙 الذهب<input id="ag" type="number" min="0" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>⛏️ الخام<input id="ao" type="number" min="0" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>🍖 الطعام<input id="af" type="number" min="0" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>🧪 الجرعات<input id="ap" type="number" min="0" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>⭐ المستوى<input id="al" type="number" min="1" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>🏰 المرحلة<input id="afloor" type="number" min="1" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>❤️ الصحة القصوى<input id="amax" type="number" min="1" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>⚔️ الهجوم<input id="aatk" type="number" min="1" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
<label>🛡️ الدفاع<input id="adef" type="number" min="0" style="width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#242832;color:#fff;border:1px solid #3a404b"></label>
</div>
<div class="grid2" style="margin-top:10px">
<button class="primary" onclick="applyAdmin()">💾 تطبيق القيم</button><button onclick="toggleGod()" id="godBtn">♾️ وضع الموارد اللانهائية: OFF</button>
<button onclick="adminHeal()">❤️ ملء الصحة</button><button onclick="adminWin()">🏆 إنهاء المعركة فورًا</button>
<button onclick="adminNext()">⏭️ تخطي للمرحلة التالية</button><button onclick="adminReset()">🔄 إعادة اللعبة</button>
</div></div>
<button onclick="toggleAdmin()" style="width:100%;margin:6px 0 18px">🛠️ فتح/إغلاق تحكم المطوّر</button>
</main><script>
(()=>{let s={hero:null,lv:1,xp:0,g:40,o:12,f:8,p:2,hp:100,max:100,atk:14,def:5,floor:1,e:null,log:[],god:false};const hs=[['كايل','مقاتل',125,17,7],['إيلين','رامية',90,21,3],['راين','ساحر',80,25,2]];const $=id=>document.getElementById(id);function L(x){s.log.unshift(x);s.log=s.log.slice(0,10)}function draw(){let a='';if(!s.hero)a='<div class="card"><h3>اختر بطلك</h3><div class="grid">'+hs.map((h,i)=>`<button onclick="pick(${i})"><b>${h[0]}</b><br><span class="muted">${h[1]}</span><br>❤️${h[2]} ⚔️${h[3]} 🛡️${h[4]}</button>`).join('')+'</div></div>';else if(!s.e)a=`<div class="grid2"><div class="card"><div class="muted">البطل</div><h2>${s.hero[0]}</h2><div class="stat"><span>المستوى</span><b>${s.lv}</b></div><div class="stat"><span>❤️ الصحة</span><b>${s.hp}/${s.max}</b></div><div class="bar"><div class="fill" style="width:${s.hp/s.max*100}%"></div></div><div class="stat"><span>⚔️ الهجوم</span><b>${s.atk}</b></div><div class="stat"><span>🛡️ الدفاع</span><b>${s.def}</b></div></div><div class="card"><div class="stat"><span>🪙 ذهب</span><b>${s.g}</b></div><div class="stat"><span>⛏️ خام</span><b>${s.o}</b></div><div class="stat"><span>🍖 طعام</span><b>${s.f}</b></div><div class="stat"><span>🧪 جرعات</span><b>${s.p}</b></div><button class="primary" style="width:100%;margin-top:12px" onclick="start()">دخول المرحلة ${s.floor}</button></div></div>`;else a=`<div class="card"><div class="muted">العدو — المرحلة ${s.floor}</div><h2>${s.e.n}</h2><div class="stat"><span>❤️ صحة العدو</span><b>${Math.max(0,s.e.h)}/${s.e.m}</b></div><div class="bar"><div class="fill" style="width:${Math.max(0,s.e.h/s.e.m*100)}%"></div></div><div class="grid2" style="margin-top:12px"><button class="primary" onclick="hit(0)">⚔️ هجوم</button><button onclick="hit(1)">✨ مهارة</button><button onclick="heal()" ${s.p<1?'disabled':''}>🧪 جرعة (${s.p})</button><button onclick="retreat()">↩️ انسحاب</button></div></div>`;a+='<div class="card"><b>السجل</b><div class="log">'+s.log.map(x=>'<div>• '+x+'</div>').join('')+'</div></div>';$("app").innerHTML=a}window.pick=i=>{s.hero=hs[i];s.max=s.hp=hs[i][2];s.atk=hs[i][3];s.def=hs[i][4];L('تم اختيار '+hs[i][0]+' وبداية الرحلة.');draw()};window.start=()=>{let hp=42+s.floor*13,n=['حارس الطابق','ذئب الظلال','فارس مكسور','وحش المنجم'][(s.floor-1)%4];s.e={n,h:hp,m:hp,a:8+s.floor*3,d:2+s.floor};L('ظهر '+n+'!');draw()};window.hit=skill=>{let d=Math.max(1,s.atk-s.e.d+(skill?Math.floor(s.atk*.65):0));s.e.h-=d;L((skill?'المهارة':'الهجوم')+' أحدث '+d+' ضرر.');if(s.e.h<=0){let g=12+Math.floor(Math.random()*9),o=3+Math.floor(Math.random()*4),f=2+Math.floor(Math.random()*3);s.g+=g;s.o+=o;s.f+=f;s.xp+=20+s.floor*7;if(s.god){s.g=999999;s.o=999999;s.f=999999;s.p=9999}L(`انتصار! +${g} ذهب +${o} خام +${f} طعام.`);s.e=null;s.floor++;s.hp=Math.min(s.max,s.hp+8);if(s.xp>=s.lv*50){s.xp-=s.lv*50;s.lv++;s.max+=12;s.hp=s.max;s.atk+=3;s.def++;L('ارتقيت للمستوى '+s.lv+'!')}}else{s.hp-=Math.max(1,s.e.a-s.def+Math.floor(Math.random()*3));if(s.hp<=0){L('سقط البطل. تبدأ محاولة جديدة.');s.hero=null;s.e=null;s.floor=1}}draw()};window.heal=()=>{if(!s.p&&!s.god)return;if(!s.god)s.p--;let x=Math.min(35,s.max-s.hp);s.hp+=x;L('استعدت '+x+' صحة.');draw()};window.retreat=()=>{s.e=null;L('انسحبت بأمان.');draw()};window.toggleAdmin=()=>{let x=document.getElementById('admin');x.style.display=x.style.display==='none'?'block':'none';syncAdmin()};window.syncAdmin=()=>{['g','o','f','p','lv','floor','max','atk','def'].forEach(k=>{let el=document.getElementById('a'+k);if(el)el.value=s[k]})};window.applyAdmin=()=>{[['g','ag'],['o','ao'],['f','af'],['p','ap'],['lv','al'],['floor','afloor'],['max','amax'],['atk','aatk'],['def','adef']].forEach(([k,id])=>{let v=Math.max(k==='def'?0:1,Number(document.getElementById(id).value)||0);if(['g','o','f','p'].includes(k))v=Math.max(0,v);s[k]=v});s.hp=Math.min(s.max,Math.max(0,s.hp));L('تم تطبيق إعدادات المطوّر.');draw();syncAdmin()};window.toggleGod=()=>{s.god=!s.god;document.getElementById('godBtn').textContent='♾️ وضع الموارد اللانهائية: '+(s.god?'ON':'OFF');L(s.god?'تم تفعيل الموارد اللانهائية.':'تم إيقاف الموارد اللانهائية.');draw()};window.adminHeal=()=>{s.hp=s.max;L('تمت استعادة الصحة بالكامل.');draw()};window.adminWin=()=>{if(!s.e){L('لا توجد معركة حالية.');draw();return}s.e.h=0;hit(0)};window.adminNext=()=>{s.e=null;s.floor++;L('تم الانتقال مباشرة إلى المرحلة '+s.floor+'.');draw()};window.adminReset=()=>{location.reload()};L('اختر بطلك للبدء.');draw()})();</script></body></html>
